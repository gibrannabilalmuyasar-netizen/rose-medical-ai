<!DOCTYPE html>
<html>
<head>
  <title>🌹 Rose Medical AI</title>
  <style>
    body { font-family: Arial; background: #f5f5f5; }
    .chat { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 10px; }
    .msg { margin: 10px 0; }
    .user { text-align: right; color: blue; }
    .ai { text-align: left; color: green; }
  </style>
</head>
<body>

<div class="chat">
  <h2>🌹 Rose Medical AI</h2>

  <div id="chatBox"></div>

  <input id="input" placeholder="Tanya apa saja..." style="width: 70%">
  <button onclick="kirim()">Kirim</button>
</div>

<script>
let messages = [];

async function kirim() {
  const input = document.getElementById("input").value;

  messages.push({ role: "user", content: input });
  tampilkan();

  const res = await fetch("/api/chat", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ messages })
  });

  const data = await res.json();

  messages.push({ role: "assistant", content: data.reply });
  tampilkan();

  document.getElementById("input").value = "";
}

function tampilkan() {
  const chatBox = document.getElementById("chatBox");
  chatBox.innerHTML = "";

  messages.forEach(msg => {
    const div = document.createElement("div");
    div.className = "msg " + (msg.role === "user" ? "user" : "ai");
    div.innerText = msg.content;
    chatBox.appendChild(div);
  });
}
</script>

</body>
</html>
